name: Release APK

# Al publicar un release en GitHub se compila el APK y se adjunta al release.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag del release al que adjuntar el APK
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Compilar y adjuntar APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Calcular versionCode
        # Número de commits + 100000: crece en cada commit y supera al versionCode anterior (20204)
        run: echo "ANDROID_VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      - name: Avisar que falta la keystore fija
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Sin los secretos ANDROID_KEYSTORE_* el APK se firma con una clave de debug distinta en cada ejecución y no se puede instalar encima de la versión anterior. Ver README, sección APK."

      - name: Compilar APK de debug
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Compilar APK de release firmado
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon

      - name: Verificar y renombrar el APK
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if unzip -l "$apk" | grep -E 'user_private_backup|progress_history\.json|results\.json|\.pdf'; then
            echo "::error::El APK contiene archivos con datos privados"
            exit 1
          fi
          cp "$apk" "FitTrackPro-${TAG}.apk"

      - name: Adjuntar APK al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "FitTrackPro-${TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
