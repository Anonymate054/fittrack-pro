name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, datos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run validate:data
      - run: npm test

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  android:
    name: APK Android
    needs: check
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Compilar APK de debug
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Compilar APK de release firmado
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon

      - name: Verificar que el APK no contiene datos privados
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK: $apk"
          if unzip -l "$apk" | grep -E 'user_private_backup|progress_history\.json|results\.json|\.pdf'; then
            echo "::error::El APK contiene archivos con datos privados"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: FitTrackPro-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  deploy:
    name: Desplegar en GitHub Pages
    needs: [ check, android ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm run build

      # El APK del job android se publica junto al sitio para descargarlo desde el teléfono
      - uses: actions/download-artifact@v5
        with:
          name: FitTrackPro-apk
          path: apk
      - name: Agregar el APK al sitio
        run: |
          apk=$(find apk -name '*.apk' | head -n 1)
          cp "$apk" dist/FitTrackPro.apk
          ls -la dist/FitTrackPro.apk

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
